# Weekly update PRs. Minor and patch bumps are grouped per ecosystem to keep the PR count low;
# security updates still open right away.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups: { python: { update-types: [minor, patch] } }
    commit-message: { prefix: "build(deps)" }

  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups: { web: { update-types: [minor, patch] } }
    commit-message: { prefix: "build(deps)" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
    commit-message: { prefix: "ci(deps)" }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(docker)" }

  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: weekly }
    commit-message: { prefix: "build(docker)" }
