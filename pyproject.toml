[project]
name = "schemalab"
version = "0.0.1"
description = "Database learning lab and AI data analyst on free, local LLMs"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Vinit Gunaki" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlglot>=30.30.0",
    "duckdb>=2.0.0",
    "litellm>=1.108.3",
    "langgraph>=1.2.20",
    "sqlalchemy>=2.1.8",
    "argon2-cffi>=25.1.0",
    "psycopg[binary]>=3.3.8",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemalab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fixed test passwords, and build fixture SQL from tmp paths.
"tests/**" = ["S101", "S105", "S106", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["schemalab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from src directly, so tests do not depend on the editable-install .pth file
# (macOS can mark it hidden, and Python 3.12 then skips it).
pythonpath = ["src"]
addopts = "-q --strict-markers"
# Any new warning fails the suite. The one exception is Starlette asking for httpx2 in its
# TestClient; drop it once httpx2 is in the dev deps.
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # Raised by Pydantic on a TypedDict inside LiteLLM's own modules, not our code.
    "ignore:Items? .* (is|are) using the `ReadOnly` qualifier:UserWarning",
]
