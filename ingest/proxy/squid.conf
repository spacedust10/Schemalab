# Egress proxy for ingest: HTTPS CONNECT to the source hosts only, nothing cached.
# The hosts match sources.py (usgs_host, sheet_host); a leading dot also covers subdomains.
http_port 3128

# -n: match host names only; never reverse-resolve an IP to find a match.
acl allowed dstdomain -n "/etc/squid/allowed-hosts.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !SSL_ports
http_access allow allowed
http_access deny all

cache deny all
via off
forwarded_for delete
