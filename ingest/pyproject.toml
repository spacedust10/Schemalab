[project]
name = "schemalab-ingest"
version = "0.1.0"
description = "Schemalab's lakehouse loader: dlt into DuckLake on S3-compatible storage."
requires-python = ">=3.12,<3.13"
# dlt pins duckdb<2 (dlt-hub/dlt#4595), so this service runs DuckDB 1.5 on its own while the
# API stays on 2.0. Its DuckLake catalog stays at format 1.0, which DuckDB 2.0 still reads.
dependencies = [
    "dlt[ducklake]==1.32.0",
    "duckdb==1.5.6",
    "fastapi>=0.115",
    "openpyxl>=3.1",
    "pytz>=2024.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "mypy>=1.13", "pytest>=8.3", "ruff>=0.8", "types-requests>=2.32"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ingest"]

[[tool.mypy.overrides]]
module = ["dlt.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
