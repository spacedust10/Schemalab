# Core stack: `docker compose up`.
# Later profiles (platform, ml, obs) add services as those features land.
name: schemalab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: schemalab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schemalab}
      POSTGRES_DB: schemalab
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemalab"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      SCHEMALAB_DATABASE_URL: postgresql://schemalab:${POSTGRES_PASSWORD:-schemalab}@postgres:5432/schemalab
      # Ollama runs on the host so it can use the Mac GPU.
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

  web:
    build: apps/web
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
