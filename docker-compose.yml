# Core stack: `docker compose up`.
# Later profiles (platform, ml, obs) add services as those features land.
name: schemalab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: schemalab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schemalab}
      POSTGRES_DB: schemalab
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemalab"]
      interval: 5s
      retries: 10

  # Transaction lab sandbox: runs users' SQL, so it holds nothing else and has no host port.
  # No volume: its data is disposable.
  labdb:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:-lab}
      POSTGRES_DB: lab
    command: ["postgres", "-c", "deadlock_timeout=1s", "-c", "max_connections=60"]
    networks: [lab]  # internal: only the API can reach it, and it cannot reach out
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      SCHEMALAB_DATABASE_URL: postgresql+psycopg://schemalab:${POSTGRES_PASSWORD:-schemalab}@postgres:5432/schemalab
      # Ollama runs on the host so it can use the Mac GPU.
      SCHEMALAB_OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SCHEMALAB_LAB_ADMIN_DSN: postgresql://lab:${LAB_DB_PASSWORD:-lab}@labdb:5432/lab
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./data/samples:/app/data/samples:ro", "uploads:/app/data/uploads"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    networks: [app, lab]
    depends_on:
      postgres: { condition: service_healthy }
      labdb: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

  web:
    build: apps/web
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    networks: [app]
    depends_on:
      api: { condition: service_healthy }

networks:
  app: {}
  lab: { internal: true }

volumes:
  pgdata:
  uploads:
