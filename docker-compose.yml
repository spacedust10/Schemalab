# Core stack: `docker compose up`.
# Later profiles (platform, ml, obs) add services as those features land.
name: schemalab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: schemalab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schemalab}
      POSTGRES_DB: schemalab
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemalab"]
      interval: 5s
      retries: 10

  # Transaction lab sandbox: runs users' SQL, so it holds nothing else and has no host port.
  # No volume: its data is disposable.
  labdb:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:-lab}
      POSTGRES_DB: lab
    command: ["postgres", "-c", "deadlock_timeout=1s", "-c", "max_connections=60"]
    networks: [lab]  # internal: only the API can reach it, and it cannot reach out
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      SCHEMALAB_DATABASE_URL: postgresql+psycopg://schemalab:${POSTGRES_PASSWORD:-schemalab}@postgres:5432/schemalab
      # Ollama runs on the host so it can use the Mac GPU.
      SCHEMALAB_OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SCHEMALAB_LAB_ADMIN_DSN: postgresql://lab:${LAB_DB_PASSWORD:-lab}@labdb:5432/lab
      # JSON list of emails allowed to run benchmarks above scale 0.01, e.g. '["you@example.com"]'
      SCHEMALAB_BENCH_OPERATORS: ${BENCH_OPERATORS:-[]}
      SCHEMALAB_INGEST_URL: http://ingest:8100
      SCHEMALAB_INGEST_TOKEN: ${INGEST_TOKEN:?run scripts/lake-env.sh}
      SCHEMALAB_LAKE_DIR: /app/data/lake
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./data/samples:/app/data/samples:ro
      - uploads:/app/data/uploads
      - bench:/app/data/bench
      - lakeshare:/app/data/lake  # inbox/ to hand files over, publish/ for Ask
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    networks: [app, lab, ingest]
    depends_on:
      postgres: { condition: service_healthy }
      labdb: { condition: service_healthy }
      ingest: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

  # Lakehouse (Day 19): object storage, the DuckLake catalog, and the dlt loader.
  # Garage stands in for MinIO, whose community edition no longer ships images.
  garage:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      # No defaults: run scripts/lake-env.sh once to put random values in .env.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?run scripts/lake-env.sh}
      GARAGE_DEFAULT_ACCESS_KEY: ${LAKE_S3_KEY:?run scripts/lake-env.sh}
      GARAGE_DEFAULT_SECRET_KEY: ${LAKE_S3_SECRET:?run scripts/lake-env.sh}
      GARAGE_DEFAULT_BUCKET: lake
    volumes: ["./ingest/garage.toml:/etc/garage.toml:ro", "garage:/var/lib/garage"]
    networks: [lake]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      retries: 10

  lakedb:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lake
      POSTGRES_PASSWORD: ${LAKE_DB_PASSWORD:?run scripts/lake-env.sh}
      POSTGRES_DB: lake
    volumes: [lakedata:/var/lib/postgresql/data]
    networks: [lake]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lake"]
      interval: 5s
      retries: 10

  ingest:
    build: { context: ., dockerfile: Dockerfile.ingest }
    environment:
      INGEST_CATALOG: postgresql://lake:${LAKE_DB_PASSWORD:?run scripts/lake-env.sh}@lakedb:5432/lake
      INGEST_DATA_ROOT: s3://lake
      INGEST_S3_ENDPOINT: garage:3900
      INGEST_S3_KEY: ${LAKE_S3_KEY:?run scripts/lake-env.sh}
      INGEST_S3_SECRET: ${LAKE_S3_SECRET:?run scripts/lake-env.sh}
      INGEST_TOKEN: ${INGEST_TOKEN:?run scripts/lake-env.sh}
      INGEST_PUBLISH_DIR: /data/lake/publish
      INGEST_INBOX_DIR: /data/lake/inbox
    volumes: ["lakeshare:/data/lake"]
    # lake: storage and catalog (no way out). ingest: only the API calls in.
    # egress: the USGS feed and Google Sheets. Not on app or lab, so no route to their databases.
    networks: [lake, ingest, egress]
    depends_on:
      garage: { condition: service_healthy }
      lakedb: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 5s
      retries: 10

  web:
    build: apps/web
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    networks: [app]
    depends_on:
      api: { condition: service_healthy }

networks:
  app: {}
  lab: { internal: true }
  lake: { internal: true }
  ingest: { internal: true }
  egress: {}

volumes:
  pgdata:
  uploads:
  bench:
  garage:
  lakedata:
  lakeshare:
